name: Read exact ongoing ECG training status
on:
  push:
    branches: ['research/hybrid-digitizer-*']
    paths:
      - '.github/workflows/owned-training-status.yml'
      - 'reproductions/runpod/owned_training_status.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install hash-verified Runpod CLI
        run: |
          curl --fail --location --silent --show-error https://github.com/runpod/runpodctl/releases/download/v3.0.1/runpodctl-linux-amd64 --output /tmp/runpodctl
          echo 'b66d11eca8cacbf18a2de6943c6e18a79ffbdc8a3c30aa13a49dc6cfc15d4239  /tmp/runpodctl' | sha256sum --check
          chmod 755 /tmp/runpodctl
      - name: Read only the original training execution
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API }}
        run: python -m reproductions.runpod.owned_training_status --cli /tmp/runpodctl --out build/owned-training-status.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-owned-training-status
          path: build/owned-training-status.json
