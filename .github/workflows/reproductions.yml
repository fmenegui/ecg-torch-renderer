name: Independent ECG reproductions
on:
  push:
    branches: [main, 'research/reproduce-ecg-methods-from-zero-*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      ECG_REPRO_NPJ_UPSTREAM: ${{ github.workspace }}/build/reproduction-sources/npj
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU verification stack
        run: |
          python -m pip install torch==2.7.0 torchvision==0.22.0 torchaudio==2.7.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r reproductions/requirements-common.txt
      - name: Fetch original pinned npj source and weights
        run: python -m reproductions.bootstrap --method npj --dest build/reproduction-sources
      - name: Independent controls and native source audit
        run: |
          python -m unittest discover -s reproductions/tests -v
          python -m reproductions.npj.audit --upstream "$ECG_REPRO_NPJ_UPSTREAM" --out build/reproductions/npj-source-audit.json
          python -m ruff check reproductions --select E,F --ignore E501
      - name: Replay disclosed geometry mechanism controls
        run: python -m reproductions.powerful_medical.controls --out build/reproductions/pm-controls
      - uses: actions/upload-artifact@v4
        with:
          name: reproduction-contracts
          path: build/reproductions
  runpod-access:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify authorized Runpod control plane without provisioning
        run: python -m reproductions.runpod_preflight --out build/runpod-control-preflight.json
      - uses: actions/upload-artifact@v4
        with:
          name: runpod-control-preflight
          path: build/runpod-control-preflight.json
