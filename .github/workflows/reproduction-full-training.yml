name: Full npj training on Runpod
on:
  push:
    branches: ['research/reproduce-ecg-methods-from-zero-*']
    paths:
      - '.github/workflows/reproduction-full-training.yml'
      - 'reproductions/runpod/training-plan.json'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ecg-reproduction-runpod-control
  cancel-in-progress: false
jobs:
  admit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      admitted: ${{ steps.admission.outputs.admitted }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: admission
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m reproductions.runpod.admission
  segment1:
    needs: admit
    if: needs.admit.outputs.admitted == 'true'
    uses: ./.github/workflows/reproduction-training-segment.yml
    with:
      segment: '1'
    secrets:
      RUNPOD_API: ${{ secrets.RUNPOD_API }}
  segment2:
    needs: [admit, segment1]
    if: ${{ !cancelled() && needs.admit.outputs.admitted == 'true' }}
    uses: ./.github/workflows/reproduction-training-segment.yml
    with:
      segment: '2'
      previous: '1'
    secrets:
      RUNPOD_API: ${{ secrets.RUNPOD_API }}
  segment3:
    needs: [admit, segment2]
    if: ${{ !cancelled() && needs.admit.outputs.admitted == 'true' }}
    uses: ./.github/workflows/reproduction-training-segment.yml
    with:
      segment: '3'
      previous: '2'
    secrets:
      RUNPOD_API: ${{ secrets.RUNPOD_API }}
  segment4:
    needs: [admit, segment3]
    if: ${{ !cancelled() && needs.admit.outputs.admitted == 'true' }}
    uses: ./.github/workflows/reproduction-training-segment.yml
    with:
      segment: '4'
      previous: '3'
    secrets:
      RUNPOD_API: ${{ secrets.RUNPOD_API }}
  segment5:
    needs: [admit, segment4]
    if: ${{ !cancelled() && needs.admit.outputs.admitted == 'true' }}
    uses: ./.github/workflows/reproduction-training-segment.yml
    with:
      segment: '5'
      previous: '4'
    secrets:
      RUNPOD_API: ${{ secrets.RUNPOD_API }}
