name: Physical ECG clock integration on Runpod
on:
  push:
    branches: ['research/hybrid-digitizer-*']
    paths:
      - '.github/workflows/physical-clock-runpod.yml'
      - 'reproductions/pm_benchmark/clock-plan.json'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ecg-hybrid-runpod-control
  cancel-in-progress: false
jobs:
  admit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      admitted: ${{ steps.admission.outputs.admitted }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: admission
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m reproductions.runpod.admission --workflow physical-clock-runpod.yml --plan reproductions/pm_benchmark/clock-plan.json
  validate:
    needs: admit
    if: needs.admit.outputs.admitted == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded CPU verification dependencies
        run: |
          python -m pip install torch==2.7.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[benchmark]' numpy==2.5.4 scipy==1.18.1 Pillow==13.0.0 matplotlib==3.11.2 shapely==2.1.2 opencv-python-headless==4.11.0.86 PyYAML==6.0.3 pandas==3.1.0
      - name: Run integration and reference-isolation checks before allocating
        run: |
          python -m unittest discover -s tests -v
          python -m unittest discover -s reproductions/tests -v
  benchmark:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 37
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install hash-verified Runpod CLI
        run: |
          curl --fail --location --silent --show-error https://github.com/runpod/runpodctl/releases/download/v3.0.1/runpodctl-linux-amd64 --output /tmp/runpodctl
          echo 'b66d11eca8cacbf18a2de6943c6e18a79ffbdc8a3c30aa13a49dc6cfc15d4239  /tmp/runpodctl' | sha256sum --check
          chmod 755 /tmp/runpodctl
      - name: Read live price and stock, then provision one bounded inference GPU
        run: python -u -m reproductions.runpod.controller --cli /tmp/runpodctl --plan reproductions/pm_benchmark/clock-plan.json --out build/physical-clock provision
      - name: Run paired native and physical-clock readouts without references
        run: python -u -m reproductions.runpod.controller --cli /tmp/runpodctl --plan reproductions/pm_benchmark/clock-plan.json --out build/physical-clock execute
      - name: Delete the owned inference pod and verify absence
        if: always()
        run: python -u -m reproductions.runpod.controller --cli /tmp/runpodctl --plan reproductions/pm_benchmark/clock-plan.json --out build/physical-clock cleanup
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: physical-clock-gpu-results
          path: |
            build/physical-clock/control.json
            build/physical-clock/results.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: physical-clock-cleanup-receipt
          path: build/physical-clock/control.json
